[project]
name = "thermosense"
version = "2.0.0"
description = "Hyperlocal temperature intelligence — FastAPI + React dashboard"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "pyarrow>=14.0.0",
  "statsmodels>=0.14.0",
  "pmdarima>=2.0.4",
  "lightgbm>=4.0.0",
  "scikit-learn>=1.5.0",
  "mlflow>=2.10.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.0.0",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "matplotlib>=3.9.0",
  "seaborn>=0.13.0",
  "plotly>=5.18.0",
]

[tool.vercel]
entrypoint = "src.api.main:app"

[tool.vercel.scripts]
build = "bash scripts/vercel_build.sh"
