[project]
name = "thermosense"
version = "2.0.0"
description = "Hyperlocal temperature intelligence - FastAPI + React dashboard"
requires-python = ">=3.11"
# Vercel runtime deps. LightGBM is omitted here: its native libgomp is unavailable
# on the Vercel Python image. Full local/Docker install still uses requirements.txt.
dependencies = [
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "statsmodels>=0.14.0",
  "pmdarima>=2.0.4",
  "scikit-learn>=1.5.0",
  "fastapi>=0.110.0",
  "pydantic>=2.0.0",
  "requests>=2.31.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
]

[tool.vercel]
entrypoint = "src.api.main:app"

[tool.vercel.scripts]
build = "bash scripts/vercel_build.sh"
