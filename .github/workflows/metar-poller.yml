name: Hourly airport METAR poll

on:
  schedule:
    - cron: '17 * * * *'  # hourly at :17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests python-dotenv pyyaml
      - name: Poll VOBG METAR and store closest 9 PM IST reading
        run: python -m src.data.airport_metar
      - name: Commit the DB if it changed
        run: |
          git config user.name "Charan Rathore"
          git config user.email "180254320+charan-rathore@users.noreply.github.com"
          git add data/baselines/forecasts.db
          if git diff --cached --quiet; then
            echo "no new reading in window"
          else
            git commit -s -m "data: hourly VOBG METAR reading [skip ci]"
            git push
          fi
