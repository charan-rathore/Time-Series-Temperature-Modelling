<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1090" viewBox="0 0 1100 1090" role="img" aria-labelledby="title desc"><title id="title">ThermoSense stores and decision boundaries</title><desc id="desc">Hardware observations, model preparation and API consumers are distinct paths. Baseline SQLite is not training parquet. Forecast responses can be placeholders.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#326b48"/></marker></defs><rect width="1100" height="1090" fill="#f4f3e9"/><style>text{font-family:system-ui,sans-serif;fill:#153d2e}.small{font-size:14px;fill:#526657}.label{font-size:12px;letter-spacing:1px;font-weight:600}.title{font-size:19px;font-weight:600}</style><text x="38" y="44" class="label">THERMOSENSE / SOURCE MAP AT f9267d8</text><text x="38" y="91" font-family="Georgia,serif" font-size="34">Separate stores. Honest forecast evidence.</text><text x="38" y="148" class="label">EDGE OBSERVATIONS</text><rect x="38" y="174" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="54" y="206" class="title">DHT22 or simulation</text><text x="54" y="239" class="small">Read timestamp + source label</text><text x="54" y="268" class="small">No live hardware claim</text><path d="M200 311v29" stroke="#326b48" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="347" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="54" y="379" class="title">Local SQLite queue</text><text x="54" y="412" class="small">Unsynced readings on the Pi</text><text x="54" y="441" class="small">Retained until acknowledged</text><path d="M200 484v29" stroke="#326b48" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="520" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="54" y="552" class="title">Uploader + sensor route</text><text x="54" y="585" class="small">Batch POST; daily 21:00 selection</text><text x="54" y="614" class="small">Incomplete ack keeps local rows</text><path d="M200 657v29" stroke="#326b48" stroke-width="2" marker-end="url(#arrow)"/><rect x="38" y="693" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="54" y="725" class="title">Baseline SQLite actuals</text><text x="54" y="758" class="small">daily_actuals table</text><text x="54" y="787" class="small">Not automatically training data</text><text x="388" y="148" class="label">MODEL PREPARATION</text><rect x="388" y="174" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="404" y="206" class="title">Regional + legacy inputs</text><text x="404" y="239" class="small">Open-Meteo + local legacy record</text><text x="404" y="268" class="small">Source types stay distinct</text><path d="M550 311v29" stroke="#326b48" stroke-width="2" marker-end="url(#arrow)"/><rect x="388" y="347" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="404" y="379" class="title">Parquet + prior features</text><text x="404" y="412" class="small">Merge, flagged gaps, lag windows</text><text x="404" y="441" class="small">Sensor upload is a separate path</text><path d="M550 484v29" stroke="#326b48" stroke-width="2" marker-end="url(#arrow)"/><rect x="388" y="520" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="404" y="552" class="title">Training artifacts</text><text x="404" y="585" class="small">Model files + results.json</text><text x="404" y="614" class="small">Optional packages and logging</text><path d="M550 657v29" stroke="#326b48" stroke-width="2" marker-end="url(#arrow)"/><rect x="388" y="693" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="404" y="725" class="title">ModelManager</text><text x="404" y="758" class="small">Load available models</text><text x="404" y="787" class="small">Fallbacks remain possible</text><text x="738" y="148" class="label">API CONSUMERS (NOT A CHAIN)</text><rect x="738" y="174" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="754" y="206" class="title">Forecast endpoint</text><text x="754" y="239" class="small">1-3 horizons + model_used</text><text x="754" y="268" class="small">Can return fixed 26°C values</text><rect x="738" y="347" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="754" y="379" class="title">Health and readiness</text><text x="754" y="412" class="small">Process status vs usable inputs</text><text x="754" y="441" class="small">A 200 UI is not a ready model</text><rect x="738" y="520" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="754" y="552" class="title">Feedback + job controls</text><text x="754" y="585" class="small">Parquet writes or CLI jobs</text><text x="754" y="614" class="small">No automatic distributed queue</text><rect x="738" y="693" width="324" height="134" rx="10" fill="white" stroke="#dce1d1"/><text x="754" y="725" class="title">Metrics and leaderboard</text><text x="754" y="758" class="small">Recorded results vs matched days</text><text x="754" y="787" class="small">Different stores and evidence</text><rect x="38" y="870" width="1024" height="164" rx="12" fill="#ecf0dc"/><text x="58" y="903" class="title">Trace the boundary before trusting the output</text><text x="58" y="936" class="small">Baseline SQLite and training parquet do not automatically synchronize. Feedback is a different write path.</text><text x="58" y="964" class="small">Serverless filesystem writes and background jobs are not a demonstrated durable shared service.</text><text x="58" y="992" class="small">Source authentication, real hardware, live accuracy and calibrated intervals are not established by this map.</text><text x="38" y="1063" class="small">Static overview. Open interactive.html for 12 expandable stages and code links. Documentation only.</text></svg>